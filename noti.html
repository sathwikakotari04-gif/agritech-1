<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Portal | Post Crop</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0fdf4; display: flex; justify-content: center; padding: 20px; }
        .post-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #166534; margin-bottom: 20px; text-align: center; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #374151; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 15px; background: #166534; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #15803d; }
    </style>
</head>
<body>

<div class="post-card">
    <h2>Post Your Crop</h2>
    <p style="font-size: 12px; text-align: center; margin-bottom: 20px;">Add your harvest to the market list.</p>

    <label>CROP NAME</label>
    <select id="cropName">
        <option value="paddy">Paddy (వరి)</option>
        <option value="tomato">Tomato (టమోటా)</option>
        <option value="onion">Onion (ఉల్లిపాయ)</option>
        <option value="chilli">Chilli (మిరపకాయ)</option>
        <option value="mushroom">Mushroom (పుట్టగొడుగులు)</option>
        <option value="watermelon">Watermelon (పుచ్చకాయ)</option>
    </select>

    <label>PRICE PER KG (₹)</label>
    <input type="number" id="price" placeholder="Ex: 40">

    <label>TOTAL QUANTITY (KG)</label>
    <input type="number" id="quantity" placeholder="Ex: 500">

    <button onclick="postListing()">POST TO MARKET 🚀</button>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyC6H1PHeH_ubk5gv_IKYsWzYOIvk67Bl9I",
        authDomain: "agritech-c5612.firebaseapp.com",
        projectId: "agritech-c5612",
        storageBucket: "agritech-c5612.firebasestorage.app",
        messagingSenderId: "859521048089",
        appId: "1:859521048089:web:3dd9c87a6e00297d119488"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // URL nundi phone number ni collect cheyadam (Login nundi vachina number)
    const urlParams = new URLSearchParams(window.location.search);
    const farmerPhone = urlParams.get('phone') || "Unknown Farmer";

    async function postListing() {
        const crop = document.getElementById('cropName').value;
        const price = document.getElementById('price').value;
        const qty = document.getElementById('quantity').value;

        if(!price || !qty) {
            alert("Please fill all details!");
            return;
        }

        try {
            // Firestore lo 'market_listings' collection loki data pampadam
            await db.collection("market_listings").add({
                cropName: crop,
                price: price,
                quantity: qty,
                sellerId: farmerPhone, // Idhi nee dashboard photo lo unna unique ID laga pani chestundi
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Crop added successfully to the market! ✅");
            
            // Form clear cheyadam
            document.getElementById('price').value = "";
            document.getElementById('quantity').value = "";

        } catch (error) {
            alert("Error: " + error.message);
        }
    }
</script>

</body>
</html>
